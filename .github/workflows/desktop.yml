name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-ipafont-gothic xvfb
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      # real browser + real Electron end-to-end: picking, click-to-edit UI, WebCodecs export, the mixer judged by
      # ffmpeg's meter. Electron needs a display, hence xvfb.
      - run: npx playwright install --with-deps chromium
      - run: npm run desktop:build
      - run: xvfb-run -a npm run test:e2e

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Build ShortStudio-Setup.exe
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ShortStudio-Setup
          path: release/ShortStudio-Setup.exe
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/ShortStudio-Setup.exe
